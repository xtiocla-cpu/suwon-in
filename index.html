<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="장안청소년청년센터 X 청년네트워크기획단 청량(淸凉)이 전하는 수원 청년 정책과 생활정보">
  <meta name="theme-color" content="#9ECAD6">
  <title>수원에 잇다, 청년을 잇다! | 청량(淸凉)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#home" aria-label="메인으로 이동">수원에 잇다, <strong>청년을 잇다!</strong></a>
    <button class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
    <nav class="main-nav" id="mainNav" aria-label="주 메뉴">
      <a href="#living" data-route="living">살기</a>
      <a href="#work" data-route="work">일하기</a>
      <a href="#learning" data-route="learning">배우기</a>
      <a href="#connect" data-route="connect">연결되기</a>
      <span class="nav-divider" aria-hidden="true"></span>
      <a href="#enjoy" data-route="enjoy" class="enjoy-nav">즐기기</a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <section class="hero">
      <div class="hero-inner">
        <p class="organizer">장안청소년청년센터 X 청년네트워크기획단 <span>청량(淸凉)</span></p>
        <h1>수원에 잇다,<br><em>청년을 잇다!</em></h1>
      </div>
      <div class="hero-shape shape-a"></div><div class="hero-shape shape-b"></div>
    </section>

    <section class="section-wrap category-section">
      <div class="section-heading"><h2>수원에서 시작하는 나의 생활</h2></div>
      <div class="policy-grid" id="policyGrid"></div>
    </section>

    <section class="enjoy-section">
      <div class="enjoy-heading">
        <h2>수원에서 <span>즐기기</span></h2>
      </div>
      <div class="map-layout">
        <div class="map-visual">
          <img class="suwon-map" src="assets/suwon-map.png" alt="수원시 행정동 지도">
          <img class="map-pin pin-one" src="assets/map-pin.png" alt="">
          <img class="map-pin pin-two" src="assets/map-pin.png" alt="">
          <img class="map-pin pin-three" src="assets/map-pin.png" alt="">
          <span class="map-label label-food">맛집</span>
          <span class="map-label label-place">명소</span>
          <span class="map-label label-culture">문화·축제</span>
          <span class="map-credit">지도 이미지 출처: greenblog.co.kr</span>
        </div>
        <div class="enjoy-categories">
          <a href="#enjoy" class="enjoy-category food"><span class="category-symbol">맛</span><span>맛집</span><b>↗</b></a>
          <a href="#enjoy" class="enjoy-category places"><span class="category-symbol">곳</span><span>명소</span><b>↗</b></a>
          <a href="#enjoy" class="enjoy-category culture"><span class="category-symbol">축</span><span>문화·축제</span><b>↗</b></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <a class="footer-brand" href="#home">수원에 잇다, 청년을 잇다!</a>
    <div class="footer-credit">장안청소년청년센터 X 청년네트워크기획단 청량(淸凉)</div>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
